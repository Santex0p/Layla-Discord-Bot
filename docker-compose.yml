services:
  bot-layla:
    build: .
    image: layla-bot:1.0
    container_name: layla-bot
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    networks:
      - cloudflared-net

  lavalink:
    container_name: layla-lavalink
    image: ghcr.io/lavalink-devs/lavalink:4
    networks:
      - cloudflared-net
    volumes:
      - ./application.yml:/opt/Lavalink/application.yml:ro
      - ./data:/app/data
    environment:
      - LAVALINK_PASSWORD=${LAVALINK_PASSWORD:-youshallnotpass}
      - SPOTIFY_ENABLED=${SPOTIFY_ENABLED:-false}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      - JAVA_OPTS=-Xmx1g
    restart: unless-stopped
    mem_limit: 1.5g
    pids_limit: 512
    cpus: "2.0"
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "echo > /dev/tcp/localhost/2333"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  bgutil-provider:
    container_name: layla-bgutil
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1
    init: true
    networks:
      - cloudflared-net
    restart: unless-stopped
    mem_limit: 384m
    pids_limit: 256
    cpus: "1.0"

  pot-refresher:
    container_name: layla-pot-refresher
    image: alpine:3
    init: true
    depends_on:
      lavalink:
        condition: service_started
      bgutil-provider:
        condition: service_started
    networks:
      - cloudflared-net
    volumes:
      - type: bind
        source: ./scripts/pot-refresher.sh
        target: /pot-refresher.sh
        read_only: true
        bind:
          create_host_path: false
    environment:
      - LAVALINK_PASSWORD=${LAVALINK_PASSWORD:-youshallnotpass}
      - POT_REFRESH_INTERVAL=${POT_REFRESH_INTERVAL:-1800}
    command: sh -c "apk add --no-cache curl jq >/dev/null && exec sh /pot-refresher.sh"
    restart: unless-stopped
    mem_limit: 64m
    pids_limit: 64
    cpus: "0.5"

networks:
  cloudflared-net:
    external: true
