services:
  bot-layla:
    build: .
    image: layla-bot:1.0
    container_name: layla-bot
    restart: unless-stopped
    ports:
      - "8090:8080"
    volumes:
      - /home/santiago/services/infra/web/nginx/html/layla-bot:/app/layla-media
      - ./data:/app/data
    env_file:
      - .env
    networks:
      - cloudflared-net

networks:
  cloudflared-net:
    external: true
